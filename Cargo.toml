[workspace]
resolver = "2"
members = ["core", "validation"]

# Declared once here; every member takes them with `.workspace = true`, so a
# version is bumped in one place and no two members can disagree.
[workspace.dependencies]
cargo-grip4rust = { path = "core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
