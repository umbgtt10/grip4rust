[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Gate orchestration for the grip4rust workspace"
publish = false

autotests = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
