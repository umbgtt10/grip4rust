# House coding rules, enforced by `cargo stern4rust` first in stage 2.
#
# The header rule is the one rule that cannot hold until it is told what the
# header says. Naming the file here rather than in the gate script means a
# hand-run of `cargo stern4rust` checks exactly what the gate checks.
#
# Every rule applies to every member -- `cargo-grip4rust`, `validation` and
# `xtask` -- with nothing skipped, selected or excluded. `validation` once
# skipped `paired-test-file` because it had no `src/` for its test files to be
# named after; it now has one, and each scenario's test file pairs with the
# source file naming its fixture.
#
# `fixture/` needs no exclusion. Its trees are written to score badly on
# purpose, but they carry no manifest and sit beside the members rather than
# inside one, so no scan ever reaches them.
header-file = "docs/header.txt"
