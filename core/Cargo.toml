[package]
name = "cargo-grip4rust"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "A cargo subcommand for measuring Rust testability"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
readme = "../README.md"
repository = "https://github.com/umbgtt10/grip4rust"
keywords = ["cargo", "subcommand", "search", "grep", "cli"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

autotests = false

[lib]
name = "grip"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[[test]]
name = "clean_calc_tests"
path = "tests/clean_calc_analysis_tests.rs"

[[test]]
name = "data_only_tests"
path = "tests/data_only_analysis_tests.rs"

[[test]]
name = "dep_clean_tests"
path = "tests/dep_clean_analysis_tests.rs"

[[test]]
name = "dep_injected_tests"
path = "tests/dep_injected_analysis_tests.rs"

[[test]]
name = "dep_mixed_tests"
path = "tests/dep_mixed_analysis_tests.rs"

[[test]]
name = "dep_monolith_tests"
path = "tests/dep_monolith_analysis_tests.rs"

[[test]]
name = "sloppy_calc_tests"
path = "tests/sloppy_calc_analysis_tests.rs"

[[test]]
name = "trait_check_tests"
path = "tests/trait_check_analysis_tests.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
