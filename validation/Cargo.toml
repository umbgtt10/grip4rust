# End-to-end validation of grip4rust against the fixture trees.
#
# Each of these tests points the analyser at one tree under fixture/ and asserts
# on the report it produces. Their subject is a fixture scenario, not any one
# source file in core/ -- which is what paired-test-file kept reporting while
# they lived there. They were also eight separate [[test]] targets in core's
# manifest, which is what registry-completeness was reporting: declared one by
# one beside all_tests.rs rather than in it.
#
# The scenario is what src/ names. Each `<fixture>_analysis.rs` is the one place
# that says which tree under fixture/ its scenario analyses, and
# `<fixture>_analysis_tests.rs` beside it asserts on the report -- so every test
# file pairs with a source file and paired-test-file holds here with nothing
# skipped. The harness those eight share, which every test file used to carry a
# copy of, is `FixtureAnalysis` and `CaptureReporter`.
#
# A workspace member rather than an excluded crate, so `cargo test` at the root
# still runs every one of them. The stern4rust gate in stage 2 takes this
# package as well; the measuring gates are pointed at core/ and leave it alone.
[package]
name = "validation"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
description = "End-to-end validation of grip4rust against the fixture trees"
license = "MIT"
publish = false

autotests = false

[lib]
name = "validation"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
# The package is cargo-grip4rust; its [lib] target is `grip`, which is the name
# the harness and the tests import.
cargo-grip4rust = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
